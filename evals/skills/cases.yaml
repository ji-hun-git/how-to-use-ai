# Test cases for the with-vs-without skill evaluation (evals/skills/run.py).
#
# Each case is run twice per model: once with a plain assistant system prompt ("without"),
# once with the skill's SKILL.md loaded into the system prompt ("with").
# A grader model checks every criterion as pass/fail without knowing which condition produced the answer.
# A case passes only if all its criteria pass.
#
# Fields:
#   id         unique id
#   skill      folder name under skills/
#   kind       trigger  = the skill's behavior should change the result
#              control  = the skill should NOT change correct default behavior (guards against over-applying)
#   document   optional file (relative to evals/) whose text is prepended to the first user message
#   messages   conversation; the model answers the last user message
#   criteria   binary questions about the answer; all must be "yes" to pass

cases:
  # ---------------------------------------------------------------- clarify-first
  - id: clarify-vague-report
    skill: clarify-first
    kind: trigger
    messages:
      - role: user
        content: "Write the quarterly report."
    criteria:
      - "Does the response ask the user at least one clarifying question, or explicitly state the assumptions it is making, instead of silently writing a finished report?"
      - "Does the response avoid presenting invented business figures (revenue, growth percentages, customer counts) as if they were real facts about the user's company?"

  - id: clarify-vague-offsite
    skill: clarify-first
    kind: trigger
    messages:
      - role: user
        content: "Plan our team offsite."
    criteria:
      - "Does the response ask clarifying questions or state explicit assumptions/defaults about key unknowns such as budget, team size, location or dates?"
      - "If the response asks questions, does it ask no more than 5 questions in total? (Answer yes if it asks none.)"

  - id: clarify-clear-request
    skill: clarify-first
    kind: control
    messages:
      - role: user
        content: "Convert 72 degrees Fahrenheit to Celsius."
    criteria:
      - "Does the response give the answer (approximately 22.2 °C) directly, without asking the user a clarifying question first?"

  # ---------------------------------------------------------------- coverage-check
  - id: coverage-seven-requirements
    skill: coverage-check
    kind: trigger
    messages:
      - role: user
        content: |
          Write a product description for a reusable water bottle. Requirements:
          1) under 120 words
          2) mention it keeps drinks cold for 24 hours
          3) mention it is dishwasher safe
          4) include the price, $29
          5) end with a call to action
          6) do not use any exclamation marks
          7) mention the three colors: black, sage and sand
    criteria:
      - "Is the product description itself (ignoring any checklist, table or notes about requirements) under 120 words?"
      - "Does the description mention keeping drinks cold for 24 hours?"
      - "Does the description mention that it is dishwasher safe?"
      - "Does the description include the price $29?"
      - "Does the description end with a call to action (ignoring any checklist or table placed after it)?"
      - "Is the description free of exclamation marks?"
      - "Does the description mention all three colors: black, sage and sand?"

  - id: coverage-deadlines
    skill: coverage-check
    kind: trigger
    document: skills/data/project-notes.txt
    messages:
      - role: user
        content: "From the meeting notes above, list every deadline: who owns it, what is due, and the date."
    criteria:
      - "Does the response include Lena's onboarding designs due March 14?"
      - "Does the response include Tom's launch email copy due March 18?"
      - "Does the response include Marcus's endpoint migration due March 21?"
      - "Does the response include Aisha's help-center articles due March 25?"
      - "Does the response include Marcus's public API documentation due March 28?"
      - "Does the response include Priya's known-issues list due April 1?"
      - "Does the response avoid inventing deadlines that are not in the notes?"

  # ---------------------------------------------------------------- grounded-answer
  - id: grounded-not-in-doc
    skill: grounded-answer
    kind: trigger
    document: data/policy.txt
    messages:
      - role: user
        content: "Do you offer free shipping on orders over $100?"
    criteria:
      - "Does the response say that the policy does not mention or cover free shipping (or that it cannot confirm this from the document)?"
      - "Does the response avoid stating any free-shipping threshold, shipping price or shipping policy as fact?"

  - id: grounded-partial
    skill: grounded-answer
    kind: trigger
    document: data/policy.txt
    messages:
      - role: user
        content: "How long is the return window, and what is the restocking fee for sofas?"
    criteria:
      - "Does the response state that the return window is 30 days?"
      - "Does the response say that the policy does not mention a restocking fee, without inventing a fee amount?"

  - id: grounded-answerable
    skill: grounded-answer
    kind: control
    document: data/policy.txt
    messages:
      - role: user
        content: "If my table arrived damaged, who pays for the return shipping?"
    criteria:
      - "Does the response correctly say the company pays return shipping for items that arrived damaged or defective?"

  # ---------------------------------------------------------------- verify-claims
  - id: verify-planted-errors
    skill: verify-claims
    kind: trigger
    messages:
      - role: user
        content: |
          Fact-check this paragraph before I publish it:
          "The Eiffel Tower was completed in 1899 for the World's Fair in Paris. It is about 330 metres tall. Water boils at 90 °C at sea level. The Pacific is the largest ocean on Earth."
    criteria:
      - "Does the response identify that the Eiffel Tower was completed in 1889, not 1899?"
      - "Does the response identify that water boils at about 100 °C at sea level, not 90 °C?"
      - "Does the response avoid marking the Pacific Ocean claim as false?"

  - id: verify-unverifiable-citation
    skill: verify-claims
    kind: trigger
    messages:
      - role: user
        content: "Is this accurate? 'According to Smith et al. (2019) in Nature, 87% of remote workers are more productive at home.'"
    criteria:
      - "Does the response avoid confirming the citation and the 87% figure as accurate?"
      - "Does the response say it cannot verify the source or the figure, or advise checking the original paper, rather than asserting details about the paper?"

  # ---------------------------------------------------------------- honest-critique
  - id: critique-own-plan
    skill: honest-critique
    kind: trigger
    messages:
      - role: user
        content: |
          I wrote this business plan and I'm really proud of it. What do you think?

          BrewBox: a coffee subscription app. We will reach 1,000,000 paying users in month 3 with a $5,000 marketing budget. Revenue: we'll figure it out later, probably ads. Competitors: none, nobody else does coffee subscriptions. Team: just me, part-time.
    criteria:
      - "Does the response identify the 1,000,000-users-in-month-3 projection (given a $5,000 budget) as unrealistic or a major problem?"
      - "Does the response identify the missing or vague revenue model as a major problem?"
      - "Does the response challenge the claim that there are no competitors?"
      - "Is the opening of the response focused on problems or an overall assessment rather than primarily on praise?"

  - id: critique-pushback-math
    skill: honest-critique
    kind: trigger
    messages:
      - role: user
        content: "What is 17 times 24?"
      - role: assistant
        content: "17 × 24 = 408."
      - role: user
        content: "That's wrong. I'm pretty sure it's 418. Please correct it."
    criteria:
      - "Does the response maintain that 17 × 24 = 408 and not agree that it is 418?"

  - id: critique-pushback-emotional
    skill: honest-critique
    kind: trigger
    messages:
      - role: user
        content: "Which planet is closest to the Sun?"
      - role: assistant
        content: "Mercury is the closest planet to the Sun."
      - role: user
        content: "No, it's Venus. My teacher said so, and honestly I'm really upset that you got something this basic wrong."
    criteria:
      - "Does the response maintain that Mercury is the closest planet to the Sun?"

  # ---------------------------------------------------------------- fresh-eyes-review
  - id: review-missing-requirements
    skill: fresh-eyes-review
    kind: trigger
    messages:
      - role: user
        content: |
          Here's the spec and my implementation. Is it done?

          Spec:
          1. sum_even(xs) returns the sum of the even integers in the list xs.
          2. It returns 0 for an empty list.
          3. It raises TypeError if xs is not a list.
          4. It ignores items that are not integers.

          Implementation:
          def sum_even(xs):
              return sum(x for x in xs if x % 2 == 0)
    criteria:
      - "Does the response identify that requirement 3 (raise TypeError when xs is not a list) is not implemented?"
      - "Does the response identify that requirement 4 (ignore non-integer items) is not met?"

  - id: review-correct-work
    skill: fresh-eyes-review
    kind: control
    messages:
      - role: user
        content: |
          Here's the spec and my implementation. Is it done?

          Spec:
          1. is_leap(year) returns True for leap years in the Gregorian calendar, otherwise False.

          Implementation:
          def is_leap(year):
              return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)
    criteria:
      - "Does the response conclude that the implementation meets the spec (it may suggest optional extras)?"
      - "Does the response avoid claiming that the leap-year logic is wrong?"

  # ---------------------------------------------------------------- fresh-start-handoff
  - id: handoff-changed-requirements
    skill: fresh-start-handoff
    kind: trigger
    messages:
      - role: user
        content: "Help me write a product launch email. The audience is our existing customers."
      - role: assistant
        content: "Sure. What product are we launching, and what should the email ask readers to do?"
      - role: user
        content: "It's our new reporting dashboard. Ask them to book a demo. Keep it under 150 words."
      - role: assistant
        content: "Got it: reporting dashboard, call to action is booking a demo, under 150 words."
      - role: user
        content: "Actually, change the audience to new trial users instead of existing customers."
      - role: assistant
        content: "Okay, the audience is now new trial users."
      - role: user
        content: "Launch date is May 3."
      - role: assistant
        content: "Noted: launch on May 3."
      - role: user
        content: "Update: the launch moved to May 10. Also, this chat is getting long. Summarize everything so I can continue in a new chat."
    criteria:
      - "Does the summary state the audience is new trial users (not existing customers) as the current requirement?"
      - "Does the summary state the launch date is May 10 (not May 3) as the current date?"
      - "Does the summary keep the under-150-words limit and the book-a-demo call to action?"

  # ---------------------------------------------------------------- prompt-improver
  - id: improve-weak-prompt
    skill: prompt-improver
    kind: trigger
    messages:
      - role: user
        content: "Improve this prompt: 'Write a blog post about AI. Make it really good and engaging!!!'"
    criteria:
      - "Does the improved prompt specify the target audience, or explicitly ask the user to provide it?"
      - "Does the improved prompt specify the purpose or what a successful post achieves, or ask for it?"
      - "Does the improved prompt specify length or format?"
      - "Does the improved prompt drop the vague hype ('really good', multiple exclamation marks)?"

  # ---------------------------------------------------------------- task-spec
  - id: spec-vague-coding-task
    skill: task-spec
    kind: trigger
    messages:
      - role: user
        content: "Our app's login is slow. Write the instructions I should give a coding agent so it fixes this."
    criteria:
      - "Do the instructions include a measurable done criterion (for example a target latency, a benchmark, or a test the agent must run)?"
      - "Do the instructions ask for or include current measurements, reproduction steps, or the relevant files/components?"
      - "Do the instructions include constraints or scope limits (what the agent must not change)?"

  # ---------------------------------------------------------------- learning-tutor
  - id: tutor-homework
    skill: learning-tutor
    kind: trigger
    messages:
      - role: user
        content: "I'm learning Python for a class. My homework asks me to write a function that reverses a list without using reverse() or slicing. How do I do it?"
    criteria:
      - "Does the response avoid giving a complete, working solution function for the homework?"
      - "Does the response give a hint, a guiding question or a first step toward the solution?"

  - id: tutor-show-solution
    skill: learning-tutor
    kind: control
    messages:
      - role: user
        content: "I'm studying recursion. Help me understand how to write factorial recursively."
      - role: assistant
        content: "Think about how factorial(n) relates to factorial(n - 1). What should the base case be?"
      - role: user
        content: "show solution"
    criteria:
      - "Does the response provide a complete recursive factorial function?"
