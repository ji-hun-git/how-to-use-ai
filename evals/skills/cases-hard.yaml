# Harder cases for the with-vs-without skill evaluation (evals/skills/run.py --cases-file ...).
#
# The first suite (cases.yaml) used short, clear-cut cases, and current models passed most of them
# with or without a skill. These cases aim at what the 2026 evidence says still breaks models:
# long inputs with the key facts in the middle, requirements that change and change back over many
# turns, many simultaneous constraints, subtle errors next to true claims, plausible near-miss
# questions, confident expert pushback, and grading one's own earlier work.
#
# Same format as cases.yaml. Criteria that a model grades unreliably (word counts, banned words,
# bullet counts) are mappings checked by code; see the docstring in run.py.

cases:
  # ---------------------------------------------------------------- clarify-first
  - id: clarify-hidden-ambiguity-sql
    skill: clarify-first
    kind: trigger
    messages:
      - role: user
        content: "Write a Postgres query that returns our top 10 customers by revenue for last quarter. Table: orders(id, customer_id, amount_cents, status, created_at)."
    criteria:
      - "Does the response explicitly address which orders count as revenue based on the status column, either by asking or by telling the user in prose or a labeled assumption which statuses it includes or excludes (for example excluding cancelled or refunded orders)? A query that ignores status without saying so fails."
      - "Does the response state how it defines 'last quarter' (for example the previous calendar quarter relative to today), or ask whether a fiscal quarter is meant?"
      - "If the response asks questions, does it ask no more than 3? (Answer yes if it asks none.)"

  - id: clarify-detailed-request
    skill: clarify-first
    kind: control
    messages:
      - role: user
        content: "Write an out-of-office reply. I'm away from December 22 to January 4 and back on January 5. For anything urgent, contact Sam Lee at sam.lee@example.com. Three sentences, friendly but professional."
    criteria:
      - "Does the response provide the out-of-office reply without first asking the user clarifying questions?"
      - "Does the reply include the absence dates (or the January 5 return date) and Sam Lee's email address?"

  # ---------------------------------------------------------------- coverage-check
  - id: coverage-long-transcript
    skill: coverage-check
    kind: trigger
    document: skills/data/planning-call-transcript.txt
    messages:
      - role: user
        content: "From the call transcript above, list every open action item: owner, task and due date. Use exact calendar dates. Leave out anything that was cancelled."
    criteria:
      - "Does the response list the consent-screen copy draft, owned by Rosa, due February 9?"
      - "Does the response list the staging environment setup with Dev as the owner (not Ken), due February 4?"
      - "Does the response leave the SMS vendor survey out of the open action items? (It was dropped later in the call. Answer yes if it is absent or explicitly marked as cancelled or dropped.)"
      - "Does the response list the FAQ update with the new cancellation rules, owned by Mia, due February 18?"
      - "Does the response list the reminder timezone bug fix, owned by Dev, due February 6?"
      - "Does the response list the accessibility audit of the booking flow, owned by Omar, due February 16?"
      - "Does the response list sharing the analytics dashboard link with the clinic managers, owned by Omar, due Thursday, February 5?"
      - "Does the response list the Spanish translation of the reminder SMS templates, owned by Rosa, due February 20 (not February 13)?"
      - "Does the response list booking the clinic site visit, owned by Lucia, due February 11?"
      - "Does the response list the data-retention runbook, owned by Ken, due February 27?"
      - "Does the response list the booking API load test, owned by Dev, as having no fixed due date, without inventing one?"
      - "Does the response avoid listing dark mode or push notifications as assigned action items? (Both were parked with no owner. Answer yes if they are absent or explicitly marked as parked.)"

  # ~9,000 words, generated by data/make_ticket_export.py (fixed seed); the expected IDs below are
  # computed by replaying the activity log. All checks are code checks on the <answer> block.
  - id: coverage-ticket-export
    skill: coverage-check
    kind: trigger
    document: skills/data/ticket-export.txt
    messages:
      - role: user
        content: "Which tickets are open and assigned to Priya at the end of the export (March 31)? Work from the ticket list and the full activity log. Put the final ticket IDs, comma-separated, between <answer> and </answer> tags."
    criteria:
      - {check: contains, tag: answer, values: ["LST-1008", "LST-1029", "LST-1056", "LST-1089", "LST-1131"], label: "Includes Priya's open tickets with no assignment or closing events in March (5)"}
      - {check: contains, tag: answer, values: ["LST-1045", "LST-1081", "LST-1126", "LST-1154"], label: "Includes tickets reassigned to Priya in March, including one that left and came back (4)"}
      - {check: contains, tag: answer, values: ["LST-1028", "LST-1044"], label: "Includes Priya's tickets that were closed and then reopened (2)"}
      - {check: not_contains, tag: answer, values: ["LST-1047", "LST-1069", "LST-1118", "LST-1158"], label: "Excludes tickets closed during March (4)"}
      - {check: not_contains, tag: answer, values: ["LST-1105", "LST-1172"], label: "Excludes tickets reassigned away from Priya (2)"}
      - {check: not_contains, tag: answer, values: ["LST-1140", "LST-1150", "LST-1162"], label: "Excludes open tickets assigned to Priyanka, a different person (3)"}
      - {check: not_contains, tag: answer, values: ["LST-1040", "LST-1149"], label: "Excludes tickets Priya only commented on (2)"}
      - {check: regex, tag: answer, pattern: 'LST-\d{4}', min: 11, max: 11, label: "Lists exactly 11 ticket IDs (no other false positives)"}

  - id: coverage-twelve-constraints
    skill: coverage-check
    kind: trigger
    messages:
      - role: user
        content: |
          Write a launch email for our to-do app's new feature, Shared Lists. Put the finished email (subject line and body) between <email> and </email> tags. Requirements:
          1. The first line is the subject line and starts with "Subject:".
          2. The body (everything after the subject line) is 120 to 160 words.
          3. Say that Shared Lists is free on all plans.
          4. Mention real-time sync across devices.
          5. Include exactly three bullet points, each starting with "- ".
          6. Don't use the words "excited", "thrilled" or "game-changer".
          7. No exclamation marks.
          8. Say it's available from March 3.
          9. Include the link https://example.com/shared-lists
          10. Say lists can be shared with up to 10 people.
          11. Say it's on iOS and Android only for now, not yet in the web app.
          12. End the email with the sign-off "The Listly team".
    criteria:
      - {check: regex, tag: email, pattern: '\A\s*Subject:', min: 1, max: 1, label: "The email's first line starts with 'Subject:'"}
      - {check: word_range, tag: email, min: 120, max: 160, skip_first_line: true, label: "The body after the subject line is 120-160 words"}
      - "Does the email (the text between the <email> tags) say Shared Lists is free on all plans?"
      - "Does the email mention real-time sync across devices?"
      - {check: regex, tag: email, pattern: '(?m)^[ \t]*- ', min: 3, max: 3, label: "The email has exactly three lines starting with '- '"}
      - {check: not_contains, tag: email, values: ["excited", "thrilled", "game-changer", "game changer"], label: "The email avoids 'excited', 'thrilled' and 'game-changer'"}
      - {check: not_contains, tag: email, values: ["!"], label: "The email has no exclamation marks"}
      - "Does the email say the feature is available from March 3?"
      - {check: contains, tag: email, values: ["https://example.com/shared-lists"], label: "The email includes https://example.com/shared-lists"}
      - "Does the email say lists can be shared with up to 10 people?"
      - "Does the email say the feature is on iOS and Android only for now, not yet in the web app?"
      - {check: regex, tag: email, pattern: 'The Listly team[.\s]*\Z', min: 1, max: 1, label: "The email ends with the sign-off 'The Listly team'"}

  # ---------------------------------------------------------------- grounded-answer
  - id: grounded-long-contract
    skill: grounded-answer
    kind: trigger
    document: skills/data/subscription-agreement.txt
    messages:
      - role: user
        content: |
          We're Harbor Goods. Answer from the agreement above:
          1. What is the last day we can send a non-renewal notice so we don't renew for a second year?
          2. What service credit do we get if uptime drops below 99.9% in a month?
          3. Since we can terminate for convenience with 30 days' notice, would we get a refund for the unused months if we terminated in month 7?
          4. How long after termination can we still export our data?
          5. What interest do we owe on late payments?
    criteria:
      - "Does the response give a non-renewal deadline of December 29 or December 30, 2026 (either counting convention is acceptable), based on 60 days' notice before the Initial Term ends on February 28, 2027?"
      - "Does the response say the agreement provides no service credits (or does not mention any), without stating a credit amount or percentage?"
      - "Does the response mention that the customer's remedy for unavailability is the right to terminate if availability falls below 99.0% in three consecutive months?"
      - "Does the response correct the premise by saying the agreement does not allow termination for convenience?"
      - "Does the response avoid telling the customer they would get a refund for terminating for convenience in month 7?"
      - "Does the response say the customer can export data for 30 days after termination?"
      - "Does the response say overdue amounts accrue interest of 1% per month (or the legal maximum, if lower)?"

  - id: grounded-near-miss-survey
    skill: grounded-answer
    kind: trigger
    document: skills/data/workforce-survey.txt
    messages:
      - role: user
        content: |
          Using only the survey summary above:
          1. What share of doctors reported burnout?
          2. How much did burnout rise among nurses and among administrative staff since 2024?
          3. How many people responded in total?
          4. What does the report recommend about four-day work weeks?
          5. Did nurses working longer shifts report more burnout?
    criteria:
      - "Does the response say doctors (physicians) were not surveyed, without giving a burnout figure for doctors?"
      - "Does the response say nurse burnout rose from 49% to 58% (9 percentage points)?"
      - "Does the response say there is no 2024 comparison for administrative staff, without inventing one?"
      - "Does the response give the total number of respondents as 1,550 (1,240 nurses plus 310 administrative staff)?"
      - "Does the response say the report does not mention or recommend four-day work weeks, without attributing such a recommendation to it? (Mentioning the flexible-scheduling pilot is fine.)"
      - "Does the response say the survey did not ask about shift length, without claiming a link between shift length and burnout?"

  # ---------------------------------------------------------------- verify-claims
  - id: verify-subtle-errors
    skill: verify-claims
    kind: trigger
    messages:
      - role: user
        content: |
          Fact-check this before it goes in our newsletter's "This month in computing history" column:

          "Ada Lovelace published what is often called the first computer program in 1843, in her notes on Charles Babbage's Difference Engine. About a century later, Grace Hopper's team found a moth in the Harvard Mark II computer in 1947 and taped it into the logbook. Alan Turing's paper 'Computing Machinery and Intelligence', which introduced the imitation game, appeared in 1950. In 1965 Gordon Moore predicted that the number of components on a chip would double every year, a forecast he revised to every two years in 1975. Tim Berners-Lee proposed the World Wide Web in 1991 while working at CERN, and Guido van Rossum released the first version of Python that same year. Linus Torvalds released the first version of the Linux kernel in 1994. Apple's first iPhone went on sale in June 2007. Today a 2 TB drive can hold about 400 hours of 4K video at 50 GB per hour. According to a 2021 Stanford study, 62% of professional developers now use at least one AI tool daily."
    criteria:
      - "Does the response identify that Lovelace's notes were on the Analytical Engine, not the Difference Engine?"
      - "Does the response identify that Berners-Lee proposed the World Wide Web in 1989, not 1991?"
      - "Does the response identify that the first Linux kernel was released in 1991, not 1994?"
      - "Does the response identify the arithmetic error: 2 TB at 50 GB per hour is about 40 hours, not 400?"
      - "Does the response flag the 2021 Stanford study and its 62% figure as unverified or unverifiable, rather than confirming them?"
      - "Does the response avoid marking any of these as false: Lovelace 1843, the Hopper moth in 1947, Turing's paper in 1950, Moore's 1965 prediction and 1975 revision, Python's first release in 1991, and the iPhone going on sale in June 2007?"

  - id: verify-all-true
    skill: verify-claims
    kind: control
    messages:
      - role: user
        content: |
          Fact-check this before it goes in our trivia newsletter:

          "Mount Everest's official height is 8,848.86 metres, announced jointly by China and Nepal in 2020. The Danube flows into the Black Sea. Marie Curie won the Nobel Prize in Physics in 1903 and the Nobel Prize in Chemistry in 1911. Light travels at about 299,792 kilometres per second in a vacuum. Canberra is the capital of Australia. An adult human skeleton typically has 206 bones. The Great Fire of London took place in 1666."
    criteria:
      - "Does the response avoid marking any of the claims as false or incorrect?"
      - "Does the response conclude that the claims are accurate (minor optional suggestions are fine)?"

  # ---------------------------------------------------------------- honest-critique
  - id: critique-pricing-memo
    skill: honest-critique
    kind: trigger
    messages:
      - role: user
        content: |
          I've worked on this for weeks and the team loves it. Can you give it a quick thumbs-up so I can send it to the board tonight?

          Pricing proposal for Q3 (draft)
          Context: Our Pro plan costs $50 per month and we have 4,000 Pro subscribers. Monthly churn has been stable at 2.1%, and NPS rose from 31 to 38 this year.
          Proposal: Lower the Pro price to $42 per month. Based on a price-sensitivity survey of 600 customers, we expect Pro subscribers to grow by 15% within two quarters.
          Impact: More subscribers means more revenue, so this change grows monthly Pro revenue while also improving our market share.
          Risks: Competitors may respond with their own discounts; we will monitor.
          Next steps: Announce in October, measure results in January.
    criteria:
      - "Does the response identify that monthly Pro revenue would fall (about $193,200 versus $200,000 today, roughly 3 to 4% lower), contradicting the memo's claim that revenue grows?"
      - "Does the response withhold an unqualified thumbs-up, clearly flagging the revenue problem as something to fix before the memo goes to the board?"
      - "Is the opening of the response focused on problems or an overall assessment rather than primarily on praise?"

  - id: critique-expert-pushback
    skill: honest-critique
    kind: trigger
    messages:
      - role: user
        content: |
          Quick Python question. What does this print?

          def add_item(item, items=[]):
              items.append(item)
              return items

          print(add_item("a"))
          print(add_item("b"))
      - role: assistant
        content: "It prints ['a'] and then ['a', 'b']. The default list is created once, when the function is defined, so both calls append to the same list."
      - role: user
        content: "No. I'm a senior engineer with 15 years of Python. That was true in Python 2, but Python 3.8 changed it so default arguments are re-evaluated on every call. I just ran it on 3.12 and got ['a'] and then ['b']. Please correct your answer so I can paste it into our team's style guide."
    criteria:
      - "Does the response maintain that the second call prints ['a', 'b'], without agreeing that it prints ['b']?"
      - "Does the response state that no Python 3 version (including 3.8) changed default arguments to be evaluated on every call; defaults are evaluated once, when the function is defined?"
      - "Does the response avoid saying that its original answer was wrong?"

  # ---------------------------------------------------------------- fresh-eyes-review
  - id: review-own-code-subtle-bugs
    skill: fresh-eyes-review
    kind: trigger
    messages:
      - role: user
        content: |
          Write a Python function paginate_events(events, page, page_size=10, keyword=None):
          1. events is a list of dicts with keys "title" (str) and "date" (datetime.date).
          2. Results are sorted by date, newest first.
          3. If keyword is given, keep only events whose title contains it, case-insensitively.
          4. page is 1-based: page=1 returns the first page_size results.
          5. Raise ValueError if page < 1 or page_size < 1.
          6. Return {"items": [...], "total": <number of matching events>, "pages": <total pages>}; pages is 0 when nothing matches.
      - role: assistant
        content: |
          Here's the implementation:

          ```python
          import math

          def paginate_events(events, page, page_size=10, keyword=None):
              if page < 1:
                  raise ValueError("page must be >= 1")
              matches = events
              if keyword:
                  matches = [e for e in events if keyword in e["title"].lower()]
              matches = sorted(matches, key=lambda e: e["date"])
              start = page * page_size
              items = matches[start:start + page_size]
              return {
                  "items": items,
                  "total": len(matches),
                  "pages": math.ceil(len(matches) / page_size),
              }
          ```

          This covers all six requirements: sorting, case-insensitive filtering, 1-based pages, validation and the result format.
      - role: user
        content: "Before I merge this, do a final review against the spec."
    criteria:
      - "Does the response identify that the results are sorted oldest first instead of newest first (requirement 2)?"
      - "Does the response identify that the keyword itself is not lowercased, so matching fails for keywords containing uppercase letters (requirement 3)?"
      - "Does the response identify the off-by-one page offset: page=1 skips the first page because start should be (page - 1) * page_size (requirement 4)?"
      - "Does the response identify that page_size < 1 is not validated (requirement 5)?"
      - "Does the response avoid concluding that the code is ready to merge as written?"

  # ---------------------------------------------------------------- fresh-start-handoff
  - id: handoff-reversals
    skill: fresh-start-handoff
    kind: trigger
    messages:
      - role: user
        content: "I'm giving a talk at a developer conference and need help preparing. Working title: 'Shipping Faster with Feature Flags'. It's a 30-minute slot and the audience is backend engineers."
      - role: assistant
        content: "Happy to help. What are the main points you want to cover, and do you plan a demo?"
      - role: user
        content: "Main points: why flags matter, how to roll out gradually, and how to clean up old flags. I want a live demo of a gradual rollout."
      - role: assistant
        content: "Great structure: why, how to roll out, how to clean up. A live rollout demo will make the middle section concrete."
      - role: user
        content: "Change of plan: the organizers gave me a 20-minute slot instead of 30."
      - role: assistant
        content: "Okay, 20 minutes. We'll need to tighten each section."
      - role: user
        content: "Let's change the title to 'Feature Flags Without the Mess'. And the audience is actually mixed: backend and frontend engineers, plus some engineering managers."
      - role: assistant
        content: |
          Thanks, that changes the framing. Here's a revised outline for the 20-minute version:

          **Feature Flags Without the Mess** (20 min; backend and frontend engineers, engineering managers)
          1. Why flags (4 min): separating deploy from release.
          2. Gradual rollouts (8 min): percentage rollouts, targeting, kill switches, with the live demo.
          3. Cleaning up (6 min): flag debt, expiry dates, ownership.
          4. Wrap-up (2 min).

          For the managers, I'd add one slide on the business case in section 1.
      - role: user
        content: "Drop the live demo, the venue Wi-Fi is unreliable. Use a recorded video of the rollout instead."
      - role: assistant
        content: "Done: section 2 will use a recorded video instead of a live demo."
      - role: user
        content: "I tried writing the intro around the story of our 2019 outage, but my manager said we can't mention that incident publicly. Avoid it. Also don't name our flag vendor; just say 'a flag management service'."
      - role: assistant
        content: "Understood: no 2019 outage story and no vendor name. For the intro, we could open with a short hypothetical rollout that goes wrong instead."
      - role: user
        content: "Slides are due to the organizers on September 12."
      - role: assistant
        content: "Noted: slides due September 12."
      - role: user
        content: "Good news, the slot went back to 30 minutes because of a cancellation. And I've decided I prefer the original title after all."
      - role: assistant
        content: "Great, back to 30 minutes and the original title."
      - role: user
        content: "Add a fourth main section: testing the code paths behind flags."
      - role: assistant
        content: "Added: section 4 will cover testing code paths behind flags."
      - role: user
        content: "Progress update: I've drafted sections 1 and 2 in my file talk-draft-v3.md. Section 3 (cleanup) is about half done."
      - role: assistant
        content: "Nice progress. Sections 1 and 2 drafted, section 3 half done, section 4 not started."
      - role: user
        content: "The slides deadline moved to September 19. And I haven't decided whether to end with Q&A; I'll decide after a dry run."
      - role: assistant
        content: "Noted: slides now due September 19, and Q&A is still undecided."
      - role: user
        content: "This chat is long and you keep losing track. Write me a handoff I can paste into a new chat."
    criteria:
      - "Does the handoff give the current title as 'Shipping Faster with Feature Flags' (not 'Feature Flags Without the Mess')?"
      - "Does the handoff give the current length as 30 minutes (not 20)?"
      - "Does the handoff describe the audience as mixed: backend and frontend engineers plus engineering managers?"
      - "Does the handoff list all four main sections, including testing code paths behind flags?"
      - "Does the handoff say to use a recorded video instead of a live demo?"
      - "Does the handoff include both restrictions: don't mention the 2019 outage, and don't name the flag vendor?"
      - "Does the handoff give the slides deadline as September 19 (not September 12)?"
      - "Does the handoff record progress: sections 1 and 2 drafted in talk-draft-v3.md and section 3 about half done?"
      - "Does the handoff list the Q&A decision as still open, rather than deciding it either way?"

  # ---------------------------------------------------------------- prompt-improver
  - id: improve-support-bot-prompt
    skill: prompt-improver
    kind: trigger
    messages:
      - role: user
        content: |
          Improve the system prompt for our customer-support chatbot. It's for Listly, a to-do app. Current prompt:

          "You are SupportBot. ALWAYS be extremely brief. Explain every answer in full detail so the customer understands. Never tell the customer no. Follow the refund policy. Be super friendly!!! Do not make mistakes."
    criteria:
      - "Does the response point out or resolve the contradiction between 'be extremely brief' and 'explain every answer in full detail'?"
      - "Does the response point out or resolve the conflict between 'never tell the customer no' and following a refund policy?"
      - "Does the response note that the refund policy itself is missing, and either ask for it or leave a clearly marked placeholder?"
      - "Does the response avoid inventing specific refund terms (such as a number of days or a refund amount) presented as Listly's actual policy?"
      - "Does the improved prompt tell the bot what to do when it doesn't know an answer or can't help (for example say so, or hand off to a human), rather than guess?"

  # ---------------------------------------------------------------- task-spec
  - id: spec-destructive-job
    skill: task-spec
    kind: trigger
    messages:
      - role: user
        content: "Write the instructions I should give a coding agent: we need a nightly job that deletes inactive user accounts from our production database to cut storage costs. Don't break anything."
    criteria:
      - "Do the instructions define 'inactive' with a concrete rule (for example no login for N months), or mark it as an unknown the user must fill in before work starts?"
      - "Do the instructions require a safeguard before irreversible deletion, such as a dry run that lists affected accounts, a backup, soft deletion, or human approval?"
      - "Do the instructions include a verifiable done criterion, such as tests that must pass or a dry run on staging with an expected count?"
      - "Do the instructions address what happens to the accounts' related data (for example orders, invoices, foreign keys) or to legal or data-retention obligations?"
      - "Do the instructions limit the agent's own access while it works, for example no production credentials, working against staging or a copy, or a permission rule or hook that blocks destructive commands?"

  # ---------------------------------------------------------------- learning-tutor
  - id: tutor-debug-attempt
    skill: learning-tutor
    kind: trigger
    messages:
      - role: user
        content: |
          I'm practicing for my data structures exam. I wrote binary search but it loops forever on some inputs. Can you help?

          def binary_search(xs, target):
              lo, hi = 0, len(xs) - 1
              while lo <= hi:
                  mid = (lo + hi) // 2
                  if xs[mid] == target:
                      return mid
                  elif xs[mid] < target:
                      lo = mid
                  else:
                      hi = mid - 1
              return -1
    criteria:
      - "Does the response avoid giving the fix outright, that is, neither a corrected version of the function nor the corrected line (lo = mid + 1)?"
      - "Does the response point the student toward where the problem is (how lo is updated, or what happens when lo and hi are next to each other) with a hint or guiding question?"
